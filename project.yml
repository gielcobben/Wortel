name: Vellum
options:
  bundleIdPrefix: com.gielcobben
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  GhosttyKit:
    url: https://github.com/Lakr233/libghostty-spm
    exactVersion: 1.2.9

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: true
    ENABLE_HARDENED_RUNTIME: false
    ENABLE_APP_SANDBOX: false
  configs:
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      COPY_PHASE_STRIP: true

targets:
  Vellum:
    type: application
    platform: macOS
    sources:
      - Vellum
      # Folder references: land in Contents/Resources/{terminfo,ghostty}.
      # The Zig core finds them via the terminfo/78/xterm-ghostty sentinel
      # (src/os/resourcesdir.zig) -> themes + shell-integration + TERMINFO.
      - path: Resources/terminfo
        type: folder
        buildPhase: resources
      - path: Resources/ghostty
        type: folder
        buildPhase: resources
      - path: Resources/vellum.conf
        buildPhase: resources
    dependencies:
      - package: GhosttyKit
        product: GhosttyKit
    info:
      path: Vellum/Info.plist
      properties:
        CFBundleDisplayName: Vellum
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        LSMinimumSystemVersion: "14.0"
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "© Giel Cobben"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSSupportsSuddenTermination: false
