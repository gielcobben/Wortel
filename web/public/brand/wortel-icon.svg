<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="100" x2="0" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fdfcf9"/>
      <stop offset="0.7" stop-color="#f1efe8"/>
      <stop offset="1" stop-color="#e4e1d7"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="600" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d9d6cb"/>
      <stop offset="0.35" stop-color="#e6e4dc"/>
      <stop offset="1" stop-color="#d3d0c5"/>
    </linearGradient>
    <linearGradient id="refl" x1="0" y1="606" x2="0" y2="860" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a2a23" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2a2a23" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cursor" x1="0" y1="300" x2="0" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2b2b25"/>
      <stop offset="1" stop-color="#1b1b17"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="haze" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.22"/>
    </filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sky)"/>
  </g>
  <g clip-path="url(#sq)">
    <rect x="100" y="600" width="824" height="324" fill="url(#water)"/>
    <!-- far rocks, lost in the fog -->
    <path d="M100 604 C 150 566, 230 556, 300 592 C 330 572, 380 570, 410 600 Z" fill="#9f9c8c" opacity="0.38" filter="url(#haze)"/>
    <path d="M640 604 C 690 560, 790 540, 870 566 C 900 560, 916 566, 924 572 L 924 604 Z" fill="#8f8c7b" opacity="0.42" filter="url(#haze)"/>
    <path d="M700 606 C 740 578, 800 572, 852 590 C 880 584, 910 590, 924 596 L 924 608 Z" fill="#4a4c33" opacity="0.55" filter="url(#soft)"/>
    <path d="M708 596 C 748 576, 800 572, 850 586" stroke="#8fa64a" stroke-width="6" fill="none" opacity="0.35" filter="url(#soft)"/>
    <!-- mist band on the waterline -->
    <rect x="100" y="572" width="824" height="44" fill="#f6f5f0" opacity="0.7" filter="url(#haze)"/>
    <!-- the cursor, and below the surface, its root -->
    <path d="M318 382 L 412 462 L 318 542" stroke="url(#cursor)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="476" y="318" width="124" height="282" rx="16" fill="url(#cursor)"/>
    <rect x="476" y="608" width="124" height="250" rx="16" fill="url(#refl)" filter="url(#soft)"/>
    <!-- ripples -->
    <path d="M420 642 h236 M454 680 h168 M486 720 h104" stroke="#fbfaf7" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
    <rect x="100" y="599" width="824" height="2" fill="#fbfaf7" opacity="0.6"/>
  </g>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#000" stroke-opacity="0.08"/>
</svg>
