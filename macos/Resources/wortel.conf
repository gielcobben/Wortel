# The terminal's entire configuration. Bundled as a read-only app resource:
# nobody edits it on their Mac; edit here and rebuild to change defaults.
# Keys: https://ghostty.org/docs/config/reference (Ghostty built from source at
# the commit in macos/GhosttyKit/ghostty.ref)
# Values started as Giel's ghostty config (minus background blur: the
# compositor tax conflicts with performance-first); font and padding have
# since been tuned for the app around them.

font-family = SF Mono
# Medium at 14 with a taller cell, rather than at 16: the same legibility
# with more air between lines, which is most of what makes a page of agent
# output read as calm instead of dense. Regular read too thin at this size.
font-style = Medium
font-size = 14
adjust-cell-height = 15%

# Follows system appearance (surface color-scheme is forwarded live).
theme = light:GitHub Light Default,dark:GitHub Dark Default

# The terminal draws the page under its text itself, in the theme's
# background, which is the page's own colour (Chrome.content; the bundled
# themes are edited to match, and PageColourTests keeps them so). Opaque, so
# that the contrast floor below measures against the page: libghostty
# multiplies the background by this opacity before measuring, and at 0 it
# measured against black and turned the light theme's text white.
background-opacity = 1

# A readability floor. Text below this contrast with what is under it is drawn
# black or white instead. A program that painted its own colours for the other
# appearance leaves text at 1.0 to 1.6 after a light or dark change (Claude
# Code's text colour on the other page, Codex's input band); the faintest
# colours meant to be seen measure 1.99 and up, and are not touched.
minimum-contrast = 1.9

# Scrollback kept per terminal, in bytes. The keeper's terminal for the session
# keeps the same (`Keeper.scrollbackBytes`): the app's surface is a copy of it.
# 10 MB was Ghostty 1.3's default; 1.4 raised its own to 50.
scrollback-limit-bytes = 10000000

cursor-style = block
cursor-style-blink = false

# Injects OSC 7 pwd reporting (zsh/bash/fish) -> GHOSTTY_ACTION_PWD -> cwd
# restore across relaunches. Scripts bundled under Resources/ghostty/.
shell-integration = detect
# no-cursor: we manage the cursor ourselves. The feature lets zle drive the
#   shape — a bar while you type, a block in vi command mode, a reset before
#   each external command — which would override the cursor-style settings
#   above at every prompt. Upstream also notes it leaks a blinking block into
#   commands launched from zle, so fzf widgets get the wrong cursor.
# ssh-terminfo: on first SSH into a host, auto-install Wortel's xterm-ghostty
#   terminfo there (infocmp | ssh ... tic), cached per host. Without this,
#   ncurses programs on the remote (nano, less, vim) abort with
#   "Error opening terminal: xterm-ghostty" because the remote has never seen
#   that entry — only the local Mac bundles it.
# ssh-env: propagate TERM/COLORTERM and fall back to xterm-256color on hosts
#   where installing the terminfo isn't possible, so the remote is never left
#   with an unknown TERM.
# no-path: upstream appends Contents/MacOS to PATH so its own `ghostty` command
#   works. We ship no binary there, so all it adds is the app's own executable,
#   named Wortel — and on a case-insensitive disk `wortel` matched it, so typing
#   our command launched a SECOND COPY OF THE APP.
#   **This line is not the whole fix.** It does turn the feature off — measured
#   from inside a session, the shell receives GHOSTTY_SHELL_FEATURES with only
#   the enabled features listed, so the negation lands. But the core puts
#   Contents/MacOS on PATH anyway, independently of the feature, so our copies
#   of the shell integration take it back off. That is where the real fix lives.
shell-integration-features = no-cursor,no-path,ssh-terminfo,ssh-env

# Default a surface to the user's home directory when Wortel doesn't pass an
# explicit cwd (a fresh first launch, or a restored session that never recorded
# one). Without this, ghostty's "inherit" default would use the launching GUI
# process's cwd, which is "/" when opened from Finder. Restored/inherited
# sessions pass their own working_directory, which overrides this.
working-directory = home

# Report running-process state to the app so Wortel can present a native
# close-confirmation sheet only when a program is still running (see
# AppDelegate.confirmClose). Ghostty itself renders no prompt when embedded;
# this just drives ghostty_surface_needs_confirm_quit.
confirm-close-surface = true

# Keep the mouse pointer visible while typing. The default (and previously
# true here) hides it via NSCursor.hide() on keystroke, which felt like the
# cursor randomly vanishing.
mouse-hide-while-typing = false

# -- Mac-native line editing -------------------------------------------------
# macOS text-field muscle memory that a terminal doesn't give you by default.
# We map each combo to the exact readline/zsh emacs sequence rather than
# flipping `macos-option-as-alt`, so Option still composes special characters
# (∫ ∆ é …) everywhere except the combos below. Sequences work in bash, zsh,
# fish, and most CLI REPLs (Python, node, psql, …).
#
# IMPORTANT: Ghostty has NO trailing/inline comments. A `#` after a value is
# swallowed into the value, so keep every comment on its own line.
#
# Word ops (Option):
#   alt+left      move word left     ESC b   (backward-word)
#   alt+right     move word right    ESC f   (forward-word)
#   alt+backspace delete word left   ESC DEL (backward-kill-word)
#   alt+delete    delete word right  ESC d   (kill-word)
keybind = alt+left=text:\x1bb
keybind = alt+right=text:\x1bf
keybind = alt+backspace=text:\x1b\x7f
keybind = alt+delete=text:\x1bd
#
# Line ops (Command):
#   cmd+left      jump to line start    C-a (beginning-of-line)
#   cmd+right     jump to line end      C-e (end-of-line)
#   cmd+backspace delete to line start  C-u (unix-line-discard)
#   cmd+delete    delete to line end    C-k (kill-line)
keybind = cmd+left=text:\x01
keybind = cmd+right=text:\x05
keybind = cmd+backspace=text:\x15
keybind = cmd+delete=text:\x0b
#
# cmd+a clears the whole input line (C-e then C-u), the shell equivalent of
# "select all + delete" in a text field. A terminal can't select just your
# typed command (the emulator only sees cells, not the prompt region), so
# this is the closest useful behavior. "Select All" (whole buffer) moves to
# cmd+shift+a — handled by the Edit menu in MainMenu.swift, which is
# authoritative for key equivalents, so it is intentionally not a keybind here.
keybind = cmd+a=text:\x05\x15
#
# cmd+z undoes the last edit to the input line, like a native text field.
# The shell's line editor owns undo; C-_ (0x1F) is its undo command in both
# readline (bash) and zle (zsh emacs keymap). It steps back through your
# typing/deletions on the current line — it does not undo executed commands.
keybind = cmd+z=text:\x1f
#
# Ghostty's own defaults on keys Wortel's menu owns. A performable binding
# reaches libghostty before the menu (SurfaceView.performKeyEquivalent, so
# ⌘C with nothing selected reaches the program), and when libghostty can't
# act it hands the key to the program. Wortel handles none of these actions,
# so each one typed a letter into the terminal instead of doing what the
# menu says. Unbound, the menu has them again:
#   cmd+j        scroll to selection   ->  Show Bottom Strip
#   cmd+shift+t  reopen closed tab     ->  Reopen Closed Tab
#   cmd+f        start search          ->  Find (a file beside the terminal)
#   cmd+g        next search match     ->  Find Next
#   cmd+shift+g  previous match        ->  Find Previous
#   cmd+comma    open config           ->  Settings
keybind = cmd+j=unbind
keybind = cmd+shift+t=unbind
keybind = cmd+f=unbind
keybind = cmd+g=unbind
keybind = cmd+shift+g=unbind
keybind = cmd+comma=unbind

# iTerm's margins: 5 at the sides, 2 top and bottom. Just enough that text
# isn't against the page's edge, little enough that a full-width rule (Claude
# Code's input box) still reads as edge to edge. What looks like a deeper inset
# on the messages is the program's own indentation, not the terminal's.
window-padding-x = 5
window-padding-y = 2
