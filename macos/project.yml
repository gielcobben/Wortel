name: Wortel
options:
  bundleIdPrefix: com.gielcobben
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  # Ghostty, built here from source: GhosttyKit (the app) and libghostty-vt
  # (the keeper, the tests) from one commit and one patch set, because the
  # keeper's terminal and the app's surface pass snapshots whose format is only
  # defined within one commit. `scripts/build-ghostty.sh` fills the package's
  # Frameworks/; see GhosttyKit/Package.swift.
  GhosttyKit:
    path: GhosttyKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.0"
  # tree-sitter — diff syntax highlighting. SwiftTreeSitter is declared
  # explicitly at the top level so every grammar package resolves against this
  # one copy (grammars pin it under two different URLs — ChimeHQ/SwiftTreeSitter
  # vs tree-sitter/swift-tree-sitter — and without a shared root dep SPM sees two
  # packages both vending a "SwiftTreeSitter" product and refuses to resolve).
  SwiftTreeSitter:
    url: https://github.com/tree-sitter/swift-tree-sitter
    from: "0.10.0"
  # One grammar per language. Each ships bindings/swift (a `tree_sitter_<lang>()`
  # module) plus a bundled queries/highlights.scm that LanguageConfiguration
  # loads. Adding a language is a package here + a row in TreeSitterLanguage.
  TreeSitterSwift:
    # Not the core org: the parser is generated from JS, and only this branch
    # commits the generated parser.c so SPM can build it.
    # Pinned to a commit on the `with-generated-files` branch, taken 2026-11-09
    # (matches macos/Package.resolved). For a newer one, look on that branch.
    url: https://github.com/alex-pinkus/tree-sitter-swift
    revision: 31d17fe7e818a2048c808b5c6fdc2dc792f4f5b5
  TreeSitterTypeScript:
    # One package, two products: TreeSitterTypeScript + TreeSitterTSX.
    url: https://github.com/tree-sitter/tree-sitter-typescript
    from: "0.23.0"
  # css / javascript / python guard scanner.c behind a working-directory-relative
  # fileExists() that fails under Xcode, so their external scanner never compiles.
  # We vendor those scanners under Grammars/ instead — and exact-pin the versions
  # so the vendored scanner can't drift from SPM's parser.c. See Grammars/README.
  TreeSitterJavaScript:
    url: https://github.com/tree-sitter/tree-sitter-javascript
    exactVersion: 0.25.0
  TreeSitterJSON:
    url: https://github.com/tree-sitter/tree-sitter-json
    from: "0.24.0"
  TreeSitterCSS:
    url: https://github.com/tree-sitter/tree-sitter-css
    exactVersion: 0.25.0
  TreeSitterPython:
    url: https://github.com/tree-sitter/tree-sitter-python
    exactVersion: 0.25.0
  TreeSitterBash:
    url: https://github.com/tree-sitter/tree-sitter-bash
    from: "0.25.0"
  TreeSitterHTML:
    url: https://github.com/tree-sitter/tree-sitter-html
    from: "0.23.0"
  TreeSitterYAML:
    # Scanner vendored too (same fileExists bug) — its scanner #includes
    # schema.core.c, which we keep on the header search path. Exact-pin so the
    # vendored scanner/schema stay matched to SPM's parser.c.
    url: https://github.com/tree-sitter-grammars/tree-sitter-yaml
    exactVersion: 0.7.2
  TreeSitterZig:
    # No version tags upstream — track the branch that ships Swift bindings.
    # Pinned to a commit on the `main` branch, taken 2026-11-09 (matches
    # macos/Package.resolved). For a newer one, look on that branch.
    url: https://github.com/maxxnino/tree-sitter-zig
    revision: a80a6e9be81b33b182ce6305ae4ea28e29211bd5
  TreeSitterGo:
    url: https://github.com/tree-sitter/tree-sitter-go
    from: "0.25.0"
  TreeSitterRust:
    url: https://github.com/tree-sitter/tree-sitter-rust
    from: "0.24.0"
  TreeSitterC:
    url: https://github.com/tree-sitter/tree-sitter-c
    from: "0.24.0"
  TreeSitterCPP:
    url: https://github.com/tree-sitter/tree-sitter-cpp
    from: "0.23.0"
  TreeSitterRuby:
    url: https://github.com/tree-sitter/tree-sitter-ruby
    from: "0.23.0"
  TreeSitterJava:
    url: https://github.com/tree-sitter/tree-sitter-java
    from: "0.23.0"
  TreeSitterTOML:
    url: https://github.com/tree-sitter-grammars/tree-sitter-toml
    from: "0.7.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Dev-build placeholder only — do NOT bump this per release. Released
    # versions are CalVer, derived by scripts/release.sh --publish and passed to
    # xcodebuild, which overrides both keys; releases/BUILD is the canonical
    # record of the last published one. Keeping a real-looking version here would
    # be a second source of truth that can drift, and a stale one could stamp a
    # build Sparkle ranks *below* what users already have — the update would then
    # silently never appear. 0.0.0 only ever reaches local builds.
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "0.0.0"
    # The update channel this build came out on: empty for a regular release,
    # "beta" when scripts/release.sh --publish --beta passes it to xcodebuild.
    # Stamped into Info.plist as WortelUpdateChannel; the first launch of a
    # beta build puts that Mac on the beta channel (Updater.swift).
    WORTEL_UPDATE_CHANNEL: ""
    # Debug builds sign ad-hoc (fast, no identity needed). Release signing is
    # done by scripts/release.sh (Developer ID + optional notarization) so that
    # dev builds stay frictionless. DEVELOPMENT_TEAM is set for completeness.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "76D2KX7X2M"
    DEAD_CODE_STRIPPING: true
    ENABLE_HARDENED_RUNTIME: false
    ENABLE_APP_SANDBOX: false
  configs:
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      COPY_PHASE_STRIP: true

targets:
  Wortel:
    type: application
    platform: macOS
    sources:
      - Wortel
      # Vendored external scanners for a few grammars whose SPM package drops
      # them under Xcode. Compiled into the app; see Grammars/README.md.
      # These are verbatim upstream copies (kept byte-for-byte matched to each
      # grammar's pinned version), so we don't edit them to silence upstream's
      # warnings — missing prototypes, size_t→uint32_t narrowing. `-w` mutes
      # them for these files only; our own code keeps full warnings.
      - path: Grammars/scanners
        compilerFlags: -w
      # Folder references: land in Contents/Resources/{terminfo,ghostty}.
      # The Zig core finds them via the terminfo/78/xterm-ghostty sentinel
      # (src/os/resourcesdir.zig) -> themes + shell-integration + TERMINFO.
      - path: Resources/terminfo
        type: folder
        buildPhase: resources
      - path: Resources/ghostty
        type: folder
        buildPhase: resources
      - path: Resources/wortel.conf
        buildPhase: resources
      # The Claude Code skill installed at launch (`AgentSkill`).
      - path: Resources/wortel-skill.md
        buildPhase: resources
      # The licence and the third-party notices, shipped in Contents/Resources:
      # the GPL and several of the MIT/BSD components ask for their notices to
      # travel with every copy of the binary. The files at the repository root
      # are the only copies; keep them there.
      - path: ../LICENSE
        buildPhase: resources
      - path: ../THIRD-PARTY-NOTICES.md
        buildPhase: resources
    dependencies:
      # The `wortel` command, copied into Contents/Resources/bin. There is no
      # install step: GhosttyRuntime puts that directory on the PATH of every
      # shell it spawns, so the command exists inside a Wortel session and
      # nowhere else — which is where all of its use is, and it keeps a
      # zero-config app free of an installer.
      - target: WortelCLI
        embed: true
        codeSign: true
        copy:
          destination: resources
          subpath: bin
      # The pty keeper, beside it. The app spawns this on demand; it is not on
      # anyone's PATH and is never run by hand.
      - target: WortelKeeper
        embed: true
        codeSign: true
        copy:
          destination: resources
          subpath: bin
      - package: GhosttyKit
        product: GhosttyKit
      - package: Sparkle
      - package: SwiftTreeSitter
        product: SwiftTreeSitter
      - package: TreeSitterSwift
        product: TreeSitterSwift
      # One product bundling both the TreeSitterTypeScript and TreeSitterTSX
      # modules — both become importable from this single dependency.
      - package: TreeSitterTypeScript
        product: TreeSitterTypeScript
      - package: TreeSitterJavaScript
        product: TreeSitterJavaScript
      - package: TreeSitterJSON
        product: TreeSitterJSON
      - package: TreeSitterCSS
        product: TreeSitterCSS
      - package: TreeSitterPython
        product: TreeSitterPython
      - package: TreeSitterBash
        product: TreeSitterBash
      - package: TreeSitterHTML
        product: TreeSitterHTML
      - package: TreeSitterYAML
        product: TreeSitterYAML
      - package: TreeSitterZig
        product: TreeSitterZig
      - package: TreeSitterGo
        product: TreeSitterGo
      - package: TreeSitterRust
        product: TreeSitterRust
      - package: TreeSitterC
        product: TreeSitterC
      - package: TreeSitterCPP
        product: TreeSitterCPP
      - package: TreeSitterRuby
        product: TreeSitterRuby
      - package: TreeSitterJava
        product: TreeSitterJava
      - package: TreeSitterTOML
        product: TreeSitterTOML
    settings:
      base:
        # Not needed by WortelTests (which compiles the git sources it exercises
        # directly), but keeps a Debug build introspectable.
        ENABLE_TESTABILITY: true
        # Lets the vendored scanner .c files resolve #include "tree_sitter/...".
        HEADER_SEARCH_PATHS: $(SRCROOT)/Grammars/include
      configs:
        # A Debug build is another app from the installed one, with its own
        # UserDefaults, until this Mac opts in: see scripts/debug-bundle-id.sh
        # and DataDirectory.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.gielcobben.Wortel.dev
    # After everything else and before Xcode signs the bundle: the Debug bundle
    # id, by whether this Mac shares its data folder with Debug builds.
    postBuildScripts:
      - name: Debug bundle id
        script: '"$SRCROOT/scripts/debug-bundle-id.sh"'
        basedOnDependencyAnalysis: false
    info:
      path: Wortel/Info.plist
      properties:
        CFBundleDisplayName: Wortel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        NSPrincipalClass: NSApplication
        # A folder dropped on the Dock icon, or "Open With" on one in Finder,
        # opens as ⌘O opens one (AppDelegate.application(_:open:)). Alternate,
        # so Wortel is offered for folders and never becomes their default.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.folder]
        NSHumanReadableCopyright: "© Giel Cobben"
        LSApplicationCategoryType: public.app-category.developer-tools
        NSSupportsSuddenTermination: false
        # No "Fill code 123456, From Messages/Mail" over the terminal. macOS
        # offers a verification code to any focused text input by default, and
        # the terminal view is one that always has the keyboard. With this, a
        # code goes only to a field that declares itself a one-time-code field:
        # a login page in a browser tab still gets it, a shell never does.
        # Ghostty sets the same key, but in its framework's plist, and macOS
        # reads it only from the app's own.
        NSAutoFillRequiresTextContentTypeForOneTimeCodeOnMac: true
        # What a program run in a session asks for. macOS charges it to the
        # terminal that started it, so the prompt says "Wortel", and without a
        # line here for a kind of access the request is refused with no prompt
        # at all. Under the hardened runtime each also needs its entitlement
        # (Wortel.entitlements, applied by scripts/release.sh).
        NSAppleEventsUsageDescription: A program running in Wortel wants to control another app.
        NSBluetoothAlwaysUsageDescription: A program running in Wortel wants to use Bluetooth.
        NSCalendarsUsageDescription: A program running in Wortel wants to use your calendars.
        NSCalendarsFullAccessUsageDescription: A program running in Wortel wants to use your calendars.
        NSCameraUsageDescription: A program running in Wortel wants to use your camera.
        NSContactsUsageDescription: A program running in Wortel wants to use your contacts.
        NSLocalNetworkUsageDescription: A program running in Wortel wants to reach devices on your local network.
        NSLocationUsageDescription: A program running in Wortel wants to use your location.
        NSMicrophoneUsageDescription: A program running in Wortel wants to use your microphone.
        NSPhotoLibraryUsageDescription: A program running in Wortel wants to use your photo library.
        NSRemindersUsageDescription: A program running in Wortel wants to use your reminders.
        NSRemindersFullAccessUsageDescription: A program running in Wortel wants to use your reminders.
        NSSpeechRecognitionUsageDescription: A program running in Wortel wants to use speech recognition.
        NSSystemAdministrationUsageDescription: A program running in Wortel wants to change system settings.
        # Browser tabs load what a session serves (http://localhost:5173) and
        # whatever else is typed, which App Transport Security would otherwise
        # refuse for being plain http.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true
        # Sparkle auto-update feed (served from the wortel-updates R2 bucket).
        SUFeedURL: https://updates.wortel.sh/appcast.xml
        # "beta" on a beta build, empty otherwise (see WORTEL_UPDATE_CHANNEL).
        WortelUpdateChannel: $(WORTEL_UPDATE_CHANNEL)
        # Check and download in the background, every 4 hours, without the
        # "check automatically?" prompt Sparkle otherwise asks on the second
        # launch. A downloaded update waits for a click on "Restart to Update"
        # (see Updater.swift); the Wortel menu turns this off.
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 14400
        # EdDSA public key — private half lives in the login Keychain (shared
        # publisher key, shared with the maintainer's other apps).
        SUPublicEDKey: +IarWSgiwu1pxk25kk/8Rcl9Mf/AXwH/Z2qFoOYXEGI=

  # The `wortel` command line tool. A plain executable — no libghostty, no
  # AppKit — that speaks the socket protocol in Wortel/CLI and nothing else.
  # It's copied into the app bundle (see the app's dependencies above) rather
  # than installed anywhere, so its whole distribution story is the app's.
  #
  # **Named `WortelCLI`, not `wortel`.** A target's name is its intermediates
  # directory, and the filesystem is case-insensitive: a target called `wortel`
  # shares `Wortel.build` with the app and the two silently overwrite each
  # other's object files. What that looks like is an app bundle whose
  # executable *is the CLI* — it launches, prints the usage and exits. The
  # product is still named `wortel`, which is what anyone types.
  WortelCLI:
    type: tool
    platform: macOS
    sources:
      - path: WortelCLI
      # Shared with the app, and that sharing is the point: one definition of
      # the commands and the framing, so the two ends cannot drift apart
      # silently. They ship together, but a hand-installed symlink can outlive
      # its app — which is why an unparseable command is answered rather than
      # dropped.
      - path: Wortel/CLI/WortelCommand.swift
      - path: Wortel/CLI/WortelCLIClient.swift
      # What `list` and `read` answer with, and how a person sees it.
      - path: Wortel/CLI/WortelReach.swift
      # What `wortel remind` was given, as a moment: resolved here, so the
      # command and the app's menu agree on what "tomorrow" means.
      - path: Wortel/Sessions/ReminderTime.swift
      # Where the sockets are, which the two ends have to agree on.
      - path: Wortel/DataDirectory.swift
    settings:
      base:
        PRODUCT_NAME: wortel
        # Ad-hoc like the app in Debug; scripts/release.sh re-signs the whole
        # bundle, this binary included, with the Developer ID.
        SKIP_INSTALL: true

  # The process that holds the ptys, so shells stop being the app's children
  # and survive it quitting. Named `WortelKeeper` for the same reason as
  # `WortelCLI`: a target's name is its intermediates directory, and on a
  # case-insensitive disk one called `wortel-keeper` is fine but anything that
  # case-folds onto `Wortel` silently shares the app's object files.
  WortelKeeper:
    type: tool
    platform: macOS
    sources:
      - path: WortelKeeper
      # Shared with the app: one definition of the wire, the descriptor passing
      # and the pty, so the two ends cannot drift. The keeper outlives the app
      # by design, so a mismatch here is not hypothetical.
      - path: Wortel/Keeper/KeeperProtocol.swift
      - path: Wortel/Keeper/OutputTail.swift
      - path: Wortel/Keeper/AgentMarkerHold.swift
      - path: Wortel/Keeper/FileDescriptorChannel.swift
      - path: Wortel/Ghostty/PtyHost.swift
      - path: Wortel/CLI/WortelCommand.swift
      - path: Wortel/Sessions/ReminderTime.swift
      - path: Wortel/CLI/WortelCLIClient.swift
      - path: Wortel/DataDirectory.swift
    # The session's terminal lives here (`KeeperTerminal`): libghostty-vt,
    # no renderer. Never GhosttyKit, which the app links: the two libraries
    # share C dependencies and must not meet in one binary.
    dependencies:
      - package: GhosttyKit
        product: GhosttyVt
    settings:
      base:
        PRODUCT_NAME: wortel-keeper
        SKIP_INSTALL: true

  # Unit tests for the git panel's logic. Run with:
  #   xcodebuild -project Wortel.xcodeproj -scheme WortelTests test
  #
  # Deliberately *not* hosted by the Wortel app. A host would launch the whole
  # terminal — libghostty, Metal, a real shell — to test pure functions and a
  # few git CLI reads, which is slow and flaky for no gain. Instead the git
  # sources under test are compiled straight into the bundle. The views aren't
  # here: what's listed is the code with invariants worth pinning, and most of
  # these tests check it against `git` itself as an oracle.
  WortelTests:
    type: bundle.unit-test
    platform: macOS
    # libghostty-vt only, for the keeper's terminal (`KeeperTerminal`). Never
    # GhosttyKit: see the keeper's target.
    dependencies:
      - package: GhosttyKit
        product: GhosttyVt
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        # DataDirectory gives the tests a throwaway folder: what they drive
        # (TerminalModeRecorder.shared, for one) writes there on its own.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WORTEL_TESTS
    sources:
      - path: WortelTests
      - path: Wortel/Git/GitModels.swift
      - path: Wortel/Git/CommitOrder.swift
      - path: Wortel/Git/CommitGraph.swift
      - path: Wortel/Git/DiffParser.swift
      # The tree-sitter-free half of highlighting (token model, hunk
      # reconstruction, capture→line mapping). DiffHighlighter itself isn't
      # here — it pulls in ~20 C grammars the unit tests have no need for.
      - path: Wortel/Git/DiffSyntax.swift
      - path: Wortel/Git/GitStatusParser.swift
      # Worktree paths and the `worktree list --porcelain` parse. Both are string
      # handling that fails silently: a slug that collides puts two branches in
      # one directory, and a mis-parsed listing hides an existing worktree so the
      # next attempt tries to create it again.
      - path: Wortel/Git/GitWorktree.swift
      # The branch of a worktree whose refs are in a reftable, read from the
      # binary table without git. Pinned against what git writes, since a
      # misread is a wrong branch on a row, not an error.
      - path: Wortel/Git/Reftable.swift
      # What removing a worktree would cost, and the removal itself. The one
      # place Wortel deletes a folder of the user's, so every verdict is pinned
      # against real git: a branch whose commits are counted as shared when
      # they aren't is a silent loss of work.
      - path: Wortel/Git/WorktreeCleanup.swift
      # The ignored files a new worktree gets copied in (.worktreeinclude). The
      # pattern language is checked against git's own, and the copy against the
      # three ways it could hurt: a nested repository, a file overwritten, a
      # dependency folder cloned whole.
      - path: Wortel/Git/WorktreeInclude.swift
      # What a pull request typed into the branch field is: `#123`, a bare
      # number only when no branch has it, a GitHub or GitLab URL, and which
      # remote a URL means. A misread opens the wrong code, or a branch
      # nobody asked for.
      - path: Wortel/Git/PullRequestRef.swift
      # What ⌘P lists besides the open sessions (archived ones, worktrees
      # nobody's in), and what Return does there.
      - path: Wortel/Git/OpenTarget.swift
      # What the git panel calls a checkout: the session in it, else its
      # branch, else its folder. A wrong pick doesn't throw, it names the
      # placeholder folder (`worktree-brave-river-1a2f`) nobody remembers.
      - path: Wortel/Git/CheckoutPlace.swift
      # The diff table. Its *views* aren't testable without a window, but its
      # metrics are, and they carry an invariant nothing else enforces: the
      # coordinator's row height must equal the static `rowHeight(forFontSize:)`
      # the History accordion sizes inline diffs with. When the two disagreed,
      # rows came out 16pt where the font wanted 18 and every descender in the
      # pane was clipped — a build-clean, test-green, entirely visual failure.
      - path: Wortel/Git/DiffView.swift
      # The file tree's git decoration. Pure value type by design — the ancestor
      # roll-up is the one piece of that pane that can be silently wrong (a
      # prefix match decorating `src/foobar` because `src/foo` changed), and it
      # needs no window, repo or shell to check. The rest of Wortel/Files stays
      # out: it's AppKit, FileManager and a live git repo.
      - path: Wortel/Files/FileTreeDecorations.swift
      # Pure Foundation, and it carries a fact about the kernel that no reading
      # of the code reveals: a vnode watch follows an inode, so a directory that
      # is replaced silently stops reporting. The tree's refresh depends on the
      # watcher saying so, and the failure mode is a pane that looks calm.
      - path: Wortel/Files/DirectoryWatcher.swift
      # Which view of a file a preview window opens on. Pure, and the one part
      # of that feature that can be wrong without looking wrong: a sticky mode
      # decided once means a bad rule is the wrong view every single time.
      - path: Wortel/Preview/PreviewMode.swift
      # Reading a file that an agent is rewriting underneath: the size cap, the
      # NUL sniff, the line-count truncation and the trailing-newline rule.
      # Every one of those is a silent failure — a cap applied after the read
      # still allocates the file, a phantom last line shifts every line number
      # under it — and `read` is a pure static over a path, so it needs no
      # window. The watching around it does, and stays out.
      - path: Wortel/Preview/PreviewDocument.swift
      # Line-based find: index arithmetic with wraparound, which is the one part
      # of a find bar that is wrong by exactly one and looks almost right.
      - path: Wortel/Preview/PreviewFind.swift
      # Which terminal modes a program has switched on, and the incremental CSI
      # scan that finds them in a byte stream arriving in arbitrary pieces. Pure,
      # and the failure it exists to stop is invisible until you paste: a mode
      # lost on reattach turns a pasted paragraph into one Enter per line. A
      # scanner that reads inside a DCS passthrough, or misses a sequence split
      # across two reads, is wrong in exactly the same silent way.
      - path: Wortel/Ghostty/TerminalModes.swift
      # A hibernated screen's palette colours, kept as palette colours through
      # libghostty's dump, which only writes them resolved. Pure byte work, and
      # wrong in a way nobody sees until the appearance next changes.
      # Where TerminalModes, SessionStore and AgentResumeStore keep their files.
      - path: Wortel/DataDirectory.swift
      # The font-size clamp, which is a `didSet` that assigns to its own
      # property — correct here, and one edit away from unbounded recursion.
      - path: Wortel/Preview/PreviewSettings.swift
      # AppKit only, and the requirement it has to meet — surviving AppKit's own
      # copyWithZone: when the toolbar builds its `»` menu — is invisible at
      # every call site and crashed the app when it went unmet. A menu item copy
      # needs no window, so it's pinned here.
      - path: Wortel/UI/ClosureMenuItem.swift
      - path: Wortel/UI/Chrome.swift
      - path: Wortel/UI/SideTabStrip.swift
      - path: Wortel/UI/TabHoverCard.swift
      # Whether a press on a titlebar tab drags the tab or the whole window.
      # Wrong, the tabs still draw and select and the window moves instead.
      - path: Wortel/UI/WindowMovability.swift
      - path: Wortel/Browser/BrowserAddress.swift
      # Which change on disk reloads a page shown from a file. Wrong, it
      # either never reloads (a watch that went deaf after a save) or reloads
      # for every file an agent touches in the folder.
      - path: Wortel/Browser/BrowserPageWatch.swift
      # Mark-up, the parts with no window in them. What is copied (a chip
      # run into the word after it reads as a typo in someone's prompt), the
      # folder and its sweep (which removes files), what a page's script
      # reports (read as if a page could send anything), and which part of
      # a very tall page is pictured.
      - path: Wortel/Markup/Mark.swift
      - path: Wortel/Markup/MarkStroke.swift
      - path: Wortel/Markup/MarkupNote.swift
      - path: Wortel/Markup/MarkupStore.swift
      - path: Wortel/Markup/WebMarkReport.swift
      - path: Wortel/Markup/MarkupSurface.swift
      - path: Wortel/Markup/MarkDrawing.swift
